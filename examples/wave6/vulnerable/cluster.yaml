apiVersion: v1
kind: Namespace
metadata:
  name: demo
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner
  namespace: demo
---
apiVersion: v1
kind: Pod
metadata:
  name: runner
  namespace: demo
spec:
  serviceAccountName: runner
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: runner
      image: example.invalid/static-fixture
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: observer
rules:
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
    resourceNames: ["worker-a"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: observer
subjects:
  - kind: User
    name: observer
    apiGroup: rbac.authorization.k8s.io
