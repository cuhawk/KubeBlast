apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner
  namespace: demo
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/deploy
    iam.gke.io/gcp-service-account: ci@demo-project.iam.gserviceaccount.com
---
apiVersion: v1
kind: Pod
metadata:
  name: runner
  namespace: demo
spec:
  serviceAccountName: runner
  containers:
    - name: placeholder
      image: example.invalid/static-analysis-fixture
      securityContext:
        privileged: true
  volumes:
    - name: host
      hostPath:
        path: /var/lib/example
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fixture-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: runner
    namespace: demo
