[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kubeblast"
version = "0.1.0"
requires-python = ">=3.12"
description = "Offline cloud and Kubernetes authorization exposure analyzer"
dependencies = ["pydantic>=2,<3", "PyYAML>=6", "networkx>=3", "Jinja2>=3", "python-hcl2>=7,<8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
kubeblast = "kubeblast.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
